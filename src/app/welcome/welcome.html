<section class="flex flex-col items-center justify-center h-screen text-center">
    <h1 class="font-bold text-4xl text-green-700">Welcome to Basil!</h1>
    <h2 class="text-lg max-w-md lg:text-2xl lg:max-w-3xl"> Pot, grow, prune and harvest basil.</h2>

    <br>

    <div class="flex flex-col sm:flex-row gap-4">
        <button matButton="tonal" routerLink="/potting"
            style="--mat-button-tonal-label-text-color: #6B4423; --mat-button-tonal-container-color: #f5e6d3; --mat-button-tonal-state-layer-color: #6B4423; --mat-button-tonal-hover-state-layer-opacity: 0.12;">
            <mat-icon>potted_plant</mat-icon>{{'About Potting' | uppercase}}</button>

        <button matButton="tonal" routerLink="/watering"
            style="--mat-button-tonal-label-text-color: #1e40af; --mat-button-tonal-container-color: #dbeafe; --mat-button-tonal-state-layer-color: #1e40af; --mat-button-tonal-hover-state-layer-opacity: 0.12;">
            <mat-icon>opacity</mat-icon>{{'About Watering' | uppercase}}</button>

        <button matButton="tonal" routerLink="/pruning"
            style="--mat-button-tonal-label-text-color: #15803d; --mat-button-tonal-container-color: #dcfce7; --mat-button-tonal-state-layer-color: #15803d; --mat-button-tonal-hover-state-layer-opacity: 0.12;">
            <mat-icon>macro_off</mat-icon>{{'About Pruning' | uppercase}}</button>
    </div>
</section>
