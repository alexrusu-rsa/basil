<section class="flex flex-col">
    <h1 class="font-bold text-4xl text-[#6B4423]">
        <button matIconButton routerLink="/welcome" aria-label="Back to welcome">
            <mat-icon class="material-icons text-[#6B4423]">arrow_back</mat-icon></button>
        Potting
    </h1>
    <mat-list>
        <mat-list-item>
            <mat-icon matListItemIcon>potted_plant</mat-icon>
            <h4 matListItemTitle class="font-bold flex items-center gap-2">The Pot</h4>
            <span matListItemLine>Choose a pot with drainage holes.</span>
        </mat-list-item>
        <mat-list-item>
            <mat-icon matListItemIcon>garden_cart</mat-icon>
            <h4 matListItemTitle class="font-bold flex items-center gap-2">Soil</h4>
            <span matListItemLine>Fill the pot with well-draining soil.</span>
        </mat-list-item>
        <mat-list-item>
            <mat-icon matListItemIcon>eco</mat-icon>
            <h4 matListItemTitle class="font-bold flex items-center gap-2">Planting</h4>
            <span matListItemLine>Plant basil seeds or seedlings.</span>
        </mat-list-item>
        <mat-list-item>
            <mat-icon matListItemIcon>wb_sunny</mat-icon>
            <h4 matListItemTitle class="font-bold flex items-center gap-2">Sunlight</h4>
            <span matListItemLine>Place the pot in a sunny location.</span>
            <span matListItemLine>Min 6 hours of sunlight daily.</span>
        </mat-list-item>
    </mat-list>
</section>
