<main class="flex flex-col items-center justify-center h-[100dvh] gap-4">
    <h1 class="font-bold text-4xl text-green-700">
        Potting
    </h1>
    <ul class="text-lg max-w-md lg:text-2xl lg:max-w-3xl list-disc list-inside">
        <li>Choose a pot with drainage holes.</li>
        <li>Fill the pot with well-draining soil.</li>
        <li>Plant basil seeds or seedlings about 1/4 inch deep.</li>
        <li>Water the soil gently to keep it moist but not soggy.</li>
        <li>Place the pot in a sunny location that receives at least 6 hours of sunlight daily.</li>
    </ul>
</main>
